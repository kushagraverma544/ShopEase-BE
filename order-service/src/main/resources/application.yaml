spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000    # Feign maximum roughly 2 seconds tak connection establish karne ki attempt karega.
            readTimeout: 2000   # Connection establish hone ke baad response read karne ke liye maximum 2 seconds.

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
